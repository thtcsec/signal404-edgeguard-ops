# Development Datadog Agent config for EdgeGuard Ops.
# api_key / site come from Compose environment (DD_API_KEY, DD_SITE) — do not embed
# ${DD_SITE} here; malformed expansion produced api.datadoghq.com. DNS failures.

hostname: edgeguard-local
env: development

apm_config:
  enabled: true
  receiver_port: 8126

dogstatsd_non_local_traffic: true
dogstatsd_port: 8125

logs_enabled: true
logs_config:
  container_collect_all: false
  auto_multi_line_detection: true

process_config:
  process_collection:
    enabled: false

inventories_configuration_enabled: false
remote_configuration:
  enabled: false
